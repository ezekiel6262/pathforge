openapi: 3.1.0
info:
  title: Veyra API
  version: 0.2.0
  description: Non-custodial preflight, simulation, and lifecycle API for Elysium-to-HyperCore graduation.
servers:
  - url: https://veyra.vercel.app
  - url: http://localhost:8787
paths:
  /health:
    get:
      summary: Process health
      responses:
        "200": { description: Healthy }
  /ready:
    get:
      summary: Elysium and Hyperliquid dependency readiness
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is unavailable }
  /api/config:
    get:
      summary: Public network and contract registry
      responses:
        "200": { description: Configuration }
  /api/auth/challenge:
    post:
      summary: Issue a short-lived wallet authentication challenge
      responses:
        "200": { description: Challenge issued in an HTTP-only cookie }
        "429": { description: Rate limit exceeded }
  /api/auth/verify:
    post:
      summary: Verify an EVM message signature and create a session
      responses:
        "200": { description: Authenticated session created }
        "401": { description: Invalid or expired challenge }
  /api/auth/session:
    get:
      summary: Read the current wallet session
      responses:
        "200": { description: Session state }
  /api/auth/logout:
    post:
      summary: Clear the current wallet session
      responses:
        "200": { description: Session cleared }
  /api/projects:
    get:
      summary: List project workspaces
      responses:
        "200": { description: Projects }
    post:
      summary: Create a project workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tokenAddress]
              properties:
                name: { type: string }
                tokenAddress: { type: string }
                deployerAddress: { type: string }
                ticker: { type: string }
      responses:
        "201": { description: Project created }
        "401": { description: Wallet authentication required }
  /api/projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      summary: Read a visible project
      responses:
        "200": { description: Project }
    patch:
      summary: Update a wallet-owned project
      responses:
        "200": { description: Updated project }
        "403": { description: Owning wallet required }
    delete:
      summary: Delete a wallet-owned project and dependent records
      responses:
        "200": { description: Project deleted }
        "403": { description: Owning wallet required }
  /api/projects/{id}/validations:
    get:
      summary: List saved validation runs
      responses:
        "200": { description: Validation history }
    post:
      summary: Execute and save a validation run
      responses:
        "201": { description: Validation saved }
  /api/projects/{id}/reports:
    get:
      summary: List saved preflight reports
      responses:
        "200": { description: Project reports }
  /api/projects/{id}/monitoring:
    get:
      summary: Refresh public lifecycle evidence with source and availability labels
      responses:
        "200": { description: Monitoring snapshot }
  /api/projects/{id}/alerts:
    get:
      summary: List project alert rules
      responses:
        "200": { description: Alert rules }
    post:
      summary: Create an alert rule for a wallet-owned project
      responses:
        "201": { description: Alert rule created }
  /api/tokens/inspect:
    post:
      summary: Inspect an Elysium ERC-20 using live RPC state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
      responses:
        "200": { description: Token inspection }
  /api/hypercore/tickers/{ticker}:
    get:
      summary: Check a HyperCore testnet ticker
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string, maxLength: 6 }
      responses:
        "200": { description: Ticker state }
  /api/preflight/validate:
    post:
      summary: Run deterministic ceremony checks
      responses:
        "200": { description: Validation result }
  /api/preflight/simulate:
    post:
      summary: Simulate a lifecycle transition without submitting a transaction
      responses:
        "200": { description: Simulation result }
  /api/actions/draft:
    post:
      summary: Generate an unsigned deployment action
      responses:
        "200": { description: Unsigned action }
        "422": { description: Preflight failed }
  /api/reports/preflight:
    post:
      summary: Generate and optionally persist a preflight report
      responses:
        "200": { description: Preflight report }
